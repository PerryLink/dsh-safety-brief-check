# 安全技术交底核对 规则库
#
# 规则数据与代码分离：替换本文件即可切换规则集版本，无需改动 TypeScript。
#
# 条款引用纪律（由 shared/ruleset.ts 强制校验）：
#   - 每条规则必须写全 document / number / clause / excerpt / kind / source，
#     且 excerpt 必须是逐字摘录，不得改写。
#   - kind: direct                       条款直接规定了所检查的要求
#   - kind: derived-from-principle       条款未直接规定，仅能由原则性条款推论（severity 最多 warn）
#   - kind: institutional-configuration 阈值出自本机构配置（severity 最多 info）
#
# ✅ 本次核查已取得逐字条款，可放心引用：
#   - 《建设工程安全生产管理条例》（**国务院令第393号，现行有效**）第二十七条（交底+双方签字）、
#     第六十四条第（一）项（罚则）
#   - 《建筑施工安全检查标准》**JGJ 59-2011** 第3.1.3条第3款四项 + 附录B 安全管理检查评分表序号3
#   - 《建筑施工安全技术统一规范》**GB 50870-2013** 第8.2.1/8.2.2/8.2.3/8.2.4条
#   - 《生产经营单位安全培训规定》（原国家安监总局令第3号，经 2013 年令第63号、2015 年令第80号两次修正）
#     第十二/十三/十六/二十二条
#
# ⚠️⚠️ 两处**必须保留**的效力勘误（写错就会把推荐性条款说成强制）：
#   1. **GB 50656-2011 第10.0.6条的"强制性条文"属性已被废止** ——
#      住房和城乡建设部公告 2022 年第 164 号载明废止该条（自 2023-06-01 起）。
#      条文内容仍在标准中，但**不得再称其为"强制性条文"**。
#      其"班前安全操作规程交底"的表述还位于**条文说明**，属非条款。
#   2. **JGJ 59-2011 的强制性条文只有第4.0.1、5.0.3条，且这两条也已被同一公告废止**；
#      本规则库引用的 **3.1.3 属推荐性检查评定条款**，因此引用它的规则全部封顶 warn。
#
# ⚠️ 班前会/班前安全活动：**国家层面无专门明文**（《安全生产法》2021 全文 119 条无"班前"字样，
#   法律/行政法规/部门规章/国家标准四个层级均无专门条款）。
#   地方文件如《山东省房屋市政工程班前"晨会"活动指南（试行）》可作参考，但**属地方规定，非全国通用**，
#   故班前相关检查出厂为**未配置**（info 级），由使用方按所在地规定开启。
#
# ⚠️ 本插件**不判断交底内容是否充分、是否有针对性、是否覆盖了该工种的危险源**。
#   那需要看交底内容与现场实际；本插件只核对**记录的齐备与闭环**。

plugin: dsh-safety-brief-check
version: "2026.2"

rules:
  - id: SB-001
    title: 交底记录应填写本机构要求的栏目
    severity: info
    basis:
      document: 《建筑施工安全技术统一规范》
      number: GB 50870-2013
      clause: 第8.2.3条
      excerpt: 安全技术交底的内容应包括：工程项目和分部分项工程的概况，工过程的危险部位和环节及可能导致生产安全事故的因素，针对危险因素采取的具体预防措施、作业中应遵守的安全操作规程以及应注意的安全事项、作业人员发现事故隐患应采取的措施、发生事故后应及时采取的避险和救援措施。
      kind: institutional-configuration
      source: https://gf.cabr-fire.com/m/article-50071.htm
    alsoBasis:
      - document: 《建筑施工安全检查标准》
        number: JGJ 59-2011
        clause: 第3.1.3条第3款第3）项
        excerpt: 安全技术交底应结合施工作业场所状况、特点、工序，对危险因素、施工方案、规范标准、操作规程和应急措施进行交底。
        kind: direct
        source: https://www.mohurd.gov.cn/gongkai/zc/wjk/art/2012/art_17339_208395.html
    params:
      requiredFields: []
    note: >-
      requiredFields 出厂为空，表示**未配置**，本条进 skipped。
      依据说明：GB 50870-2013 第8.2.3条给出了交底内容的六项要素，
      JGJ 59-2011 第3.1.3条第3款第3）项给出五项关键词（危险因素/施工方案/规范标准/操作规程/应急措施），
      可作为配置参考；具体栏目名由本机构表式决定，故不硬编码。
      本条只核对字段是否存在（空串视为未填），**不判断交底内容是否充分**。

  - id: SB-002
    title: 被交底人应全部签字确认
    severity: error
    basis:
      document: 《建设工程安全生产管理条例》
      number: 国务院令第393号
      clause: 第二十七条
      excerpt: 建设工程施工前，施工单位负责项目管理的技术人员应当对有关安全施工的技术要求向施工作业班组、作业人员作出详细说明，并由双方签字确认。
      kind: direct
      source: https://www.gov.cn/zhengce/zhengceku/2008-03/28/content_4443.htm
    alsoBasis:
      - document: 《建筑施工安全技术统一规范》
        number: GB 50870-2013
        clause: 第8.2.4条
        excerpt: 施工单位应建立分级、分层次的安全技术交底制度。安全技术交底应有书面记录，交底双方应履行签字手续，书面记录应在交底者、被交底者和安全管理者三方留存备查。
        kind: direct
        source: https://gf.cabr-fire.com/m/article-50071.htm
      - document: 《建筑施工安全检查标准》
        number: JGJ 59-2011
        clause: 第3.1.3条第3款第4）项
        excerpt: 安全技术交底应由交底人、被交底人、专职安全员进行签字确认。
        kind: direct
        source: https://www.mohurd.gov.cn/gongkai/zc/wjk/art/2012/art_17339_208395.html
    params: {}
    note: >-
      **这是本插件唯一的 error 级规则，依据是行政法规**：国务院令第393号第二十七条明文要求
      "并由双方签字确认"，对应罚则第六十四条第（一）项。
      GB 50870-2013 第8.2.4条进一步要求"书面记录应在交底者、被交底者和安全管理者三方留存备查"。
      本条逐条比对两份名单（被交底人、签字），忽略空白字符；
      "未签字"与"签字重复"分成两条不同的信息，因为对应两种不同的补正方式。
      **逐人签字 vs 集体签字**：JGJ 59-2011 与 GB 50870-2013 只要求"双方/三方签字确认"，
      **未强制逐人签署**；国家层面亦无逐人签字的明文。故本条核对的是"名单中的每个人是否都在签字列出现"，
      若本机构或项目所在地规定允许集体签署，应在材料中把签署方式写明，或把本条 disabledRules。
      本条**只比对名单**，**不判断签字是否为本人所签**——签名真伪需笔迹核对或当事人确认。

  - id: SB-003
    title: 交底日期应不晚于施工日期
    severity: warn
    basis:
      document: 《建设工程安全生产管理条例》
      number: 国务院令第393号
      clause: 第二十七条
      excerpt: 建设工程施工前，施工单位负责项目管理的技术人员应当对有关安全施工的技术要求向施工作业班组、作业人员作出详细说明，并由双方签字确认。
      kind: derived-from-principle
      source: https://www.gov.cn/zhengce/zhengceku/2008-03/28/content_4443.htm
    params:
      check:
        kind: date
        field: 交底日期
        notAfterField: 施工日期
    note: >-
      第二十七条的"施工前"是时间前提，但该条**未逐字规定"交底日期不得晚于施工日期"**，
      故本条为原则性推论、封顶 warn。
      同一天视为不晚于。若确为作业中途发现的危险源需要补充交底，晚于施工日期是正常的，
      此时应在记录中说明——这正是本条提示人工核对而不直接认定的原因。
      日期无法解析时会单独报出，**不会静默跳过**。

  - id: SB-005
    title: 实际参建工种应出现在交底记录的工种列表中
    severity: warn
    basis:
      document: 《建筑施工安全检查标准》
      number: JGJ 59-2011
      clause: 第3.1.3条第3款第2）项
      excerpt: 安全技术交底应按施工工序、施工部位、施工栋号分部分项进行。
      kind: derived-from-principle
      source: https://www.mohurd.gov.cn/gongkai/zc/wjk/art/2012/art_17339_208395.html
    params: {}
    note: >-
      JGJ 59-2011 要求交底"分部分项进行"，意味着参与该部位作业的各工种都应被交底到；
      但标准**未规定交底内容与工种的强制映射表**，故本条为原则性推论、封顶 warn。
      实际参建工种可来自材料中的 workTrades 列，也可由调用方通过 workTrades 参数传入；
      **两者都为空时本条进 skipped**——工种清单因工程而异，本插件不硬编码任何工种表。
      本条只比对工种名称是否出现，**不判断交底内容是否针对该工种**；
      名称写法不一致（如"钢筋工"与"钢筋班组"）会造成误报，建议统一台账用词。

  - id: SB-004
    title: 交底记录应能识别工程部位与交底人
    severity: warn
    basis:
      document: 《建筑施工安全技术统一规范》
      number: GB 50870-2013
      clause: 第8.2.1条
      excerpt: 安全技术交底应依据国家有关法律法规和有关标准、工程设计文件、施工组织设计和安全技术规划、专项施工方案和安全技术措施、安全技术管理文件等的要求进行。
      kind: derived-from-principle
      source: https://gf.cabr-fire.com/m/article-50071.htm
    params:
      check:
        kind: headerPresence
        fields: [subject, briefer]
      requireHeader: true
    note: >-
      8.2.1 要求交底"依据…工程设计文件、施工组织设计…进行"，即交底必须对应到具体的工程与部位；
      记录若不含工程部位与交底人，就无法确认"谁向谁交了什么部位的底"，
      可追溯性不成立。该条未逐字规定表头内容，故封顶 warn。
      requireHeader 为 false 时本条不执行。
      配置项 subject 对应材料顶层的工程/部位名称，briefer 对应交底人。

  - id: SB-006
    title: 交底记录应经交底人、被交底人、专职安全员三方签字确认
    severity: warn
    basis:
      document: 《建筑施工安全检查标准》
      number: JGJ 59-2011
      clause: 第3.1.3条第3款第4）项
      excerpt: 安全技术交底应由交底人、被交底人、专职安全员进行签字确认。
      kind: direct
      source: https://www.mohurd.gov.cn/gongkai/zc/wjk/art/2012/art_17339_208395.html
    params:
      check:
        kind: headerPresence
        fields: [交底人, 被交底人, 专职安全员]
      parties: [交底人, 被交底人, 专职安全员]
    note: >-
      本条在**表头层面**核对三方是否都有位置：JGJ 59-2011 明文要求"交底人、被交底人、专职安全员"三方签字确认。
      **严重级封顶 warn**：JGJ 59-2011 第3.1.3条属**推荐性检查评定条款**——
      该标准的强制性条文只有第4.0.1、5.0.3条，且这两条已被住建部公告 2022 年第 164 号废止。
      本条与 SB-002 的关系：SB-002 核对"被交底人是否都签了"（行政法规级，error），
      本条核对"三方位置是否齐备"（行业标准级，warn）。
      专职安全员栏位名可按本机构表式替换。

  - id: SB-007
    title: 交底内容应体现危险因素、操作规程与应急措施
    severity: warn
    basis:
      document: 《建筑施工安全技术统一规范》
      number: GB 50870-2013
      clause: 第8.2.3条
      excerpt: 安全技术交底的内容应包括：工程项目和分部分项工程的概况，工过程的危险部位和环节及可能导致生产安全事故的因素，针对危险因素采取的具体预防措施、作业中应遵守的安全操作规程以及应注意的安全事项、作业人员发现事故隐患应采取的措施、发生事故后应及时采取的避险和救援措施。
      kind: derived-from-principle
      source: https://gf.cabr-fire.com/m/article-50071.htm
    params:
      check:
        kind: textContains
        inFields: [交底内容, 安全技术交底内容, 交底要点, 主要内容]
        terms: [危险, 操作规程, 应急]
    alsoBasis:
      - document: 《建筑施工安全检查标准》
        number: JGJ 59-2011
        clause: 第3.1.3条第3款第3）项
        excerpt: 安全技术交底应结合施工作业场所状况、特点、工序，对危险因素、施工方案、规范标准、操作规程和应急措施进行交底。
        kind: direct
        source: https://www.mohurd.gov.cn/gongkai/zc/wjk/art/2012/art_17339_208395.html
    note: >-
      8.2.3 逐字给出交底内容的六项要素，JGJ 59-2011 给出五项关键词，
      两者都要求交底内容涉及危险因素、操作规程与应急措施。
      本条只做**字面出现性**核对（危险/操作规程/应急 三个词是否在交底内容中出现），
      **严重级为 warn**：字面出现不等于讲清楚了，而"讲清楚了"机器判不了——
      JGJ 59-2011 附录B 对"交底内容针对性不强"扣3~5分、"交底内容不全面"扣4分，
      说明这一项的评定本身就是检查人员的主观判断。
      未提供交底内容列时本条进 skipped。terms 与 inFields 均可按本机构表式调整。

disabled: []
